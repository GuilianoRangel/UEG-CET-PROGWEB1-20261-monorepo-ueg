@if (authService.isAuth()) {
  <ui-shell>
    <app-header (menuToggle)="toggleSidebar()"></app-header>
    
    <ui-sidebar [isOpen]="sidebarOpen()" (close)="closeSidebar()">
      <div sidebar-header class="w-full flex items-center justify-between md:hidden">
        <span class="font-bold text-primary">Menu</span>
        <button (click)="closeSidebar()" class="p-2 -mr-2 text-muted-foreground hover:text-foreground rounded-md transition-colors">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>

      <nav class="flex flex-col gap-1 px-4">
        @if (authService.isAdmin()) {
          <a routerLink="/admin" routerLinkActive="bg-primary/10 text-primary font-medium" [routerLinkActiveOptions]="{exact: true}" (click)="closeSidebar()" class="flex items-center gap-3 rounded-lg px-3 py-2 text-muted-foreground transition-all hover:text-foreground">
            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
            Usuários
          </a>
          <a routerLink="/admin/matches" routerLinkActive="bg-primary/10 text-primary font-medium" (click)="closeSidebar()" class="flex items-center gap-3 rounded-lg px-3 py-2 text-muted-foreground transition-all hover:text-foreground">
            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
            Gerenciar Jogos
          </a>
        }
        <a routerLink="/guesses" routerLinkActive="bg-primary/10 text-primary font-medium" (click)="closeSidebar()" class="flex items-center gap-3 rounded-lg px-3 py-2 text-muted-foreground transition-all hover:text-foreground">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 8v8m-4-5v5m-4-2v2M2 4h20v16H2V4z"></path></svg>
          Meu Palpite
        </a>
        <a href="javascript:void(0)" class="flex items-center gap-3 rounded-lg px-3 py-2 text-muted-foreground transition-all hover:text-foreground opacity-60 cursor-not-allowed">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
          Estágios (Em breve)
        </a>
      </nav>

      <div sidebar-footer class="text-xs text-muted-foreground text-center">
        Universidade Estadual de Goiás<br/>© 2026
      </div>
    </ui-sidebar>

    <router-outlet></router-outlet>
  </ui-shell>
} @else {
  <div class="flex flex-col min-h-screen bg-background transition-colors duration-200">
    <app-header></app-header>
    <main class="flex-1 relative flex flex-col">
      <router-outlet></router-outlet>
    </main>
  </div>
}
